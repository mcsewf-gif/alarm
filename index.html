<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>极速闹钟 · 日历静音震动版</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --ios-btn: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header {
      text-align: center;
      margin-top: 8px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .input-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    input[type="tel"] {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 14px;
      color: var(--text);
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      padding: 14px;
      letter-spacing: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="tel"]:focus {
      border-color: var(--accent);
    }
    .parsed-box {
      width: 100%;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .parsed-time {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .parsed-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .toggle-ampm {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ios {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }
    .btn-local {
      background: #334155;
      color: var(--text);
      font-size: 14px;
      padding: 12px;
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .status-card {
      text-align: center;
      display: none;
    }
    .status-card.active {
      display: block;
    }
    .countdown {
      font-size: 32px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
      color: var(--success);
    }
    .ringing {
      animation: pulse 0.6s infinite alternate;
      border-color: var(--danger);
    }
    @keyframes pulse {
      from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
      to { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }
    .row:last-child { border-bottom: none; }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      background: rgba(255,255,255,0.04);
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ 极速闹钟</h1>
      <p>上午输入 1005 → 10:05 AM ｜ 下午输入 312 → 3:12 PM</p>
    </header>

    <div class="card input-wrap">
      <input id="timeInput" type="tel" inputmode="numeric" maxlength="4" placeholder="输入数字 如 312" autofocus />

      <div class="parsed-box" id="parsedBox" style="display:none;">
        <div>
          <div class="parsed-time" id="parsedText">--:--</div>
          <div class="parsed-sub" id="parsedDay">今天</div>
        </div>
        <button class="toggle-ampm" id="toggleAmPmBtn">切换 上/下午</button>
      </div>

      <!-- 核心：同步完整日期时间到 iOS 快捷指令（日历静音震动） -->
      <button class="btn btn-ios" id="iosShortcutBtn" disabled>
        📅 同步到 iPhone 日历提醒（只震不响）
      </button>

      <!-- 备用：当前网页亮屏内倒计时提醒 -->
      <button class="btn btn-local" id="startLocalBtn" disabled>
        仅在当前网页内倒计时（需保持亮屏）
      </button>
    </div>

    <!-- 网页内倒计时状态卡片 -->
    <div class="card status-card" id="statusCard">
      <div style="font-size:13px; color:var(--muted);" id="statusLabel">网页内倒计时运行中</div>
      <div class="countdown" id="countdownText">00:00:00</div>
      <button class="btn btn-danger" id="stopBtn">停止 / 取消</button>
    </div>

    <!-- 辅助设置 -->
    <div class="card">
      <div class="row">
        <span>网页内提醒附带提示音（办公室建议关闭）</span>
        <input type="checkbox" id="soundToggle" />
      </div>
      <div class="row">
        <span>保持屏幕常亮防休眠</span>
        <input type="checkbox" id="wakeLockToggle" />
      </div>
    </div>

    <div class="hint">
      <strong>💡 办公室静音震动说明：</strong><br/>
      点击橙色按钮会自动复制精确到分钟的时间（如 <code style="color:#fbbf24;">2026-11-20 15:12</code>）并唤起 Shortcuts 中的 <code style="color:#fbbf24;">极速闹钟</code> 添加日历日程；配合 Calendar 声音设为 <strong>None</strong> 与开启 <strong>Vibration</strong>，锁屏即可安静震动。
    </div>
  </div>

  <script>
    // 动态注入 PWA Manifest 支持添加到主屏幕独立运行
    const manifest = {
      name: "极速闹钟",
      short_name: "极速闹钟",
      start_url: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text x='50' y='68' font-size='56' text-anchor='middle'>⏰</text></svg>",
        sizes: "192x192",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    const timeInput = document.getElementById('timeInput');
    const parsedBox = document.getElementById('parsedBox');
    const parsedText = document.getElementById('parsedText');
    const parsedDay = document.getElementById('parsedDay');
    const toggleAmPmBtn = document.getElementById('toggleAmPmBtn');
    const iosShortcutBtn = document.getElementById('iosShortcutBtn');
    const startLocalBtn = document.getElementById('startLocalBtn');
    const statusCard = document.getElementById('statusCard');
    const statusLabel = document.getElementById('statusLabel');
    const countdownText = document.getElementById('countdownText');
    const stopBtn = document.getElementById('stopBtn');
    const soundToggle = document.getElementById('soundToggle');
    const wakeLockToggle = document.getElementById('wakeLockToggle');

    let parsedState = null;
    let manualAmPmOverride = null; // 'AM' | 'PM' | null
    let timerId = null;
    let wakeLock = null;

    function parseSmartTime(raw) {
      const digits = raw.replace(/\D/g, '');
      if (digits.length < 3 || digits.length > 4) return null;

      let h = digits.length === 3 ? parseInt(digits[0], 10) : parseInt(digits.slice(0, 2), 10);
      let m = digits.length === 3 ? parseInt(digits.slice(1), 10) : parseInt(digits.slice(2), 10);

      if (m > 59 || h > 23) return null;

      const now = new Date();
      const currentIsPM = now.getHours() >= 12;

      let hour24 = h;
      if (h === 0) {
        hour24 = 0;
      } else if (h <= 12) {
        if (manualAmPmOverride === 'AM') {
          hour24 = h === 12 ? 0 : h;
        } else if (manualAmPmOverride === 'PM') {
          hour24 = h === 12 ? 12 : h + 12;
        } else {
          hour24 = currentIsPM ? (h === 12 ? 12 : h + 12) : (h === 12 ? 12 : h);
        }
      }

      const target = new Date(now);
      target.setHours(hour24, m, 0, 0);
      let isTomorrow = false;
      if (target <= now) {
        target.setDate(target.getDate() + 1);
        isTomorrow = true;
      }

      return { hour24, minute: m, target, isTomorrow };
    }

    function formatFullDateTime(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const hh = String(dateObj.getHours()).padStart(2, '0');
      const min = String(dateObj.getMinutes()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    function formatDisplay(state) {
      const h24 = state.hour24;
      const mStr = String(state.minute).padStart(2, '0');
      const period = h24 >= 12 ? '下午 (PM)' : '上午 (AM)';
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      const h24Str = String(h24).padStart(2, '0');
      return {
        label: `${period} ${h12}:${mStr}`,
        time24: `${h24Str}:${mStr}`,
        fullDateTime: formatFullDateTime(state.target),
        day: state.isTomorrow ? '明天（今日该时间已过）' : '今天'
      };
    }

    function updateUI() {
      parsedState = parseSmartTime(timeInput.value);
      if (!parsedState) {
        parsedBox.style.display = 'none';
        iosShortcutBtn.disabled = true;
        startLocalBtn.disabled = true;
        return;
      }
      const fmt = formatDisplay(parsedState);
      parsedText.textContent = `${fmt.label}  [${fmt.time24}]`;
      parsedDay.textContent = `${fmt.day} · ${fmt.fullDateTime}`;
      parsedBox.style.display = 'flex';
      iosShortcutBtn.disabled = false;
      startLocalBtn.disabled = false;
    }

    timeInput.addEventListener('input', () => {
      manualAmPmOverride = null;
      updateUI();
    });

    toggleAmPmBtn.addEventListener('click', () => {
      if (!parsedState) return;
      manualAmPmOverride = parsedState.hour24 >= 12 ? 'AM' : 'PM';
      updateUI();
    });

    // 同步精确到分钟的完整日期时间（如 "2026-11-20 15:12"）给 iOS 快捷指令「极速闹钟」
    iosShortcutBtn.addEventListener('click', async () => {
      if (!parsedState) return;
      const fmt = formatDisplay(parsedState);
      const fullDateTime = fmt.fullDateTime;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(fullDateTime);
        }
      } catch (e) {}

      const shortcutName = encodeURIComponent('极速闹钟');
      const inputVal = encodeURIComponent(fullDateTime);
      window.location.href = `shortcuts://run-shortcut?name=${shortcutName}&input=text&text=${inputVal}`;
    });

    // 网页内 5 次提醒引擎
    function playBeep() {
      if (!soundToggle.checked) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.45);
    }

    function triggerFiveAlerts() {
      let count = 0;
      statusCard.classList.add('ringing');
      const fireOnce = () => {
        count++;
        statusLabel.textContent = `⏰ 正在提醒：第 ${count} / 5 次`;
        if (navigator.vibrate) navigator.vibrate(600);
        playBeep();
        if (count >= 5) {
          clearInterval(alertInterval);
          setTimeout(() => {
            statusCard.classList.remove('ringing');
            statusLabel.textContent = '已完成 5 次提醒';
          }, 800);
        }
      };
      fireOnce();
      const alertInterval = setInterval(fireOnce, 1100);
    }

    startLocalBtn.addEventListener('click', () => {
      if (!parsedState) return;
      clearInterval(timerId);
      const targetTime = parsedState.target.getTime();
      statusCard.classList.add('active');
      statusCard.classList.remove('ringing');
      statusLabel.textContent = `目标时间 ${formatDisplay(parsedState).time24}（请保持屏幕常亮）`;

      timerId = setInterval(() => {
        const diff = targetTime - Date.now();
        if (diff <= 0) {
          clearInterval(timerId);
          countdownText.textContent = '00:00:00';
          triggerFiveAlerts();
          return;
        }
        const sec = Math.floor(diff / 1000);
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        countdownText.textContent = `${h}:${m}:${s}`;
      }, 250);
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(timerId);
      statusCard.classList.remove('active', 'ringing');
      if (navigator.vibrate) navigator.vibrate(0);
    });

    wakeLockToggle.addEventListener('change', async (e) => {
      if (e.target.checked && 'wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          e.target.checked = false;
        }
      } else if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    });
  </script>
</body>
</html>
